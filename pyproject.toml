[project]
name = "popote"
version = "0.3.0"
description = "Rabais des circulaires (Flipp) croisés avec la banque de recettes Notion, analysés par Claude"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]
reels = ["yt-dlp", "faster-whisper"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["popote"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
